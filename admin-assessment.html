<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Quản lý quyền làm bài | Linh Coach</title><link rel="stylesheet" href="/assessment.css"><style>
.admin-wrap{max-width:1080px;margin:0 auto;padding:40px 20px}.admin-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin:18px 0}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.admin-field{display:grid;gap:6px}.admin-field input{padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}.admin-table{width:100%;border-collapse:collapse;font-size:14px}.admin-table th,.admin-table td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top}.admin-status{min-height:24px;color:var(--teal-dark)}.admin-error{color:#b33}.admin-muted{color:var(--muted)}@media(max-width:700px){.admin-grid{grid-template-columns:1fr}.admin-card{padding:18px}.admin-table{display:block;overflow:auto;white-space:nowrap}}
</style></head>
<body class="assessment-shell"><header class="assessment-header"><a class="assessment-brand" href="/"><img src="/assets/logo-full.png" alt=""><span>Linh Coach</span></a><span class="assessment-header-note">Quản lý quyền làm bài</span></header>
<main class="admin-wrap"><section class="admin-card" id="login-card"><h1>Đăng nhập quản trị</h1><p class="admin-muted">Nhập email quản trị. Mã xác thực sẽ gửi đến email, không cần mật khẩu.</p><form id="login-form"><div class="admin-field"><label for="admin-email">Email quản trị</label><input id="admin-email" type="email" required autocomplete="email"></div><button class="assessment-button" type="submit">Gửi mã xác thực</button></form><form id="verify-form" hidden><div class="admin-field"><label for="admin-otp">Mã 6 số</label><input id="admin-otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></div><button class="assessment-button" type="submit">Vào quản trị</button></form><p id="login-status" class="admin-status" role="status"></p></section>
<section class="admin-card" id="panel" hidden><h1>Cấp quyền làm bài</h1><p class="admin-muted">Mỗi lần cấp quyền tạo một lượt làm mới, hiệu lực 30 ngày.</p><form id="grant-form"><div class="admin-grid"><div class="admin-field"><label for="grant-email">Email khách</label><input id="grant-email" type="email" required></div><div class="admin-field"><label for="grant-name">Tên khách (không bắt buộc)</label><input id="grant-name" maxlength="100"></div></div><label><input id="show-previous" type="checkbox"> Cho phép xem kết quả lần trước trong lượt mới</label><p><button class="assessment-button" type="submit">Cấp lượt làm bài</button></p><p id="grant-status" class="admin-status" role="status"></p></form><h2>Danh sách lượt đã cấp</h2><div id="grant-list" class="admin-muted">Đang tải…</div></section></main><script src="/admin-assessment.js" type="module"></script></body></html>
